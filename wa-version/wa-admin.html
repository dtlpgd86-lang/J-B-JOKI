<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J &amp; B JOKI — Admin Dashboard (WhatsApp Orders)</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("fj_theme")==="light"?"light":"dark")}catch(e){}</script>
  <style>
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: .8rem;
      margin-bottom: 2rem;
    }

    .admin-stat {
      background: var(--card-bg);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      padding: 1.2rem;
      text-align: center;
    }

    .admin-stat .num {
      font-size: 1.8rem;
      font-weight: 800;
      font-family: var(--font-head);
    }

    .admin-stat .lbl {
      font-size: .78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .order-table {
      width: 100%;
      border-collapse: collapse;
    }

    .order-table th {
      text-align: left;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted-2);
      padding: .8rem .5rem;
      border-bottom: 1px solid var(--stroke);
    }

    .order-table td {
      padding: .8rem .5rem;
      border-bottom: 1px solid var(--stroke);
      font-size: .9rem;
      vertical-align: middle;
    }

    .order-table tr:hover {
      background: var(--soft-bg);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .2rem .7rem;
      border-radius: 100px;
      font-size: .75rem;
      font-weight: 600;
    }

    .s0 {
      background: rgba(250, 204, 21, .12);
      color: #facc15;
    }

    .s1 {
      background: rgba(52, 211, 153, .12);
      color: #34d399;
    }

    .s2,
    .s3 {
      background: rgba(56, 189, 248, .12);
      color: #38bdf8;
    }

    .s4 {
      background: rgba(52, 211, 153, .12);
      color: #34d399;
    }

    .s5 {
      background: rgba(239, 68, 68, .12);
      color: #ef4444;
    }

    .status-select {
      background: var(--soft-bg);
      border: 1px solid var(--stroke);
      border-radius: 8px;
      padding: .3rem .5rem;
      font-size: .82rem;
      color: var(--text);
    }

    .wa-link {
      color: #25D366;
      text-decoration: none;
      font-weight: 600;
    }

    .wa-link:hover {
      text-decoration: underline;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: var(--muted-2);
    }

    @media (max-width:768px) {
      .order-table {
        font-size: .8rem;
      }

      .order-table td,
      .order-table th {
        padding: .5rem .3rem;
      }
    }
  </style>
</head>

<body data-page="wa-admin">
  <a href="wa-index.html" class="wa-brand" aria-label="J &amp; B JOKI"><img src="../logo.png" alt="J &amp; B JOKI"><span>J &amp; B <b>JOKI</b></span></a>
  <button class="theme-toggle fixed" id="themeToggle" aria-label="Ganti tema gelap/terang"><i class="fa-solid fa-moon"></i></button>
  <main>
    <section class="page-hero" style="padding-bottom:1rem">
      <div class="container">
        <div class="crumbs reveal"><a href="wa-index.html">Home</a> <i class="fa-solid fa-chevron-right"></i>
          <span>Admin</span>
        </div>
        <div class="admin-header">
          <div>
            <h1 class="reveal d1" style="margin:0">📋 Admin <span class="gtext">Dashboard</span></h1>
            <p class="reveal d2" style="margin-top:.3rem">Manajemen order dari WhatsApp — real-time, simpel, tanpa
              database.</p>
          </div>
          <div class="reveal d2" style="display:flex;gap:.5rem;flex-wrap:wrap">
            <a href="wa-index.html" class="btn btn-ghost btn-sm"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
            <button id="refreshBtn" class="btn btn-primary btn-sm"><i class="fa-solid fa-rotate"></i> Refresh</button>
          </div>
        </div>
      </div>
    </section>
    <section style="padding-top:0">
      <div class="container">
        <div class="admin-stats reveal" id="statsRow"></div>
        <div class="reveal d1"
          style="background:var(--card-bg);border:1px solid var(--stroke);border-radius:var(--radius-lg);padding:1.5rem;overflow-x:auto">
          <table class="order-table" id="orderTable">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Game</th>
                <th>Layanan</th>
                <th>Target</th>
                <th>Username</th>
                <th>Harga</th>
                <th>Status</th>
                <th>Kontak</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="orderBody">
              <tr>
                <td colspan="9">
                  <div class="empty-state"><i class="fa-solid fa-inbox"></i>
                    <p>Belum ada order.</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script src="../js/data.js"></script>
  <script src="wa-config.js"></script>
  <script>
    const ADMIN_TOKEN = sessionStorage.getItem("wa_admin_token") || window.prompt("Masukkan token admin WA:") || "";
    if (ADMIN_TOKEN) sessionStorage.setItem("wa_admin_token", ADMIN_TOKEN);
    const API = window.location.origin;
    const STATUS_LABELS = ["Menunggu Pembayaran", "Pembayaran Dikonfirmasi", "Menunggu Dikerjakan", "Sedang Diproses", "Selesai", "Dibatalkan"];

    function adminHeaders() {
      return {
        "Content-Type": "application/json",
        ...(ADMIN_TOKEN ? { "X-Admin-Token": ADMIN_TOKEN } : {}),
      };
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function waHref(contact) {
      const digits = String(contact || "").replace(/[^0-9]/g, "").slice(0, 20);
      if (!digits) return "#";
      return "https://wa.me/" + encodeURIComponent(digits);
    }

    async function loadOrders() {
      const res = await fetch(API + "/api/orders", { headers: adminHeaders() });
      const json = await res.json();
      if (!json.success) {
        if (res.status === 403) {
          sessionStorage.removeItem("wa_admin_token");
          alert("Token admin WA tidak valid. Muat ulang halaman untuk mencoba lagi.");
        }
        return [];
      }
      return json.data;
    }

    async function updateOrderStatus(id, status) {
      const res = await fetch(API + "/api/order/" + encodeURIComponent(id), {
        method: "PUT",
        headers: adminHeaders(),
        body: JSON.stringify({ status: parseInt(status, 10) }),
      });
      return (await res.json()).success;
    }

    function renderStats(orders) {
      const wrap = document.getElementById("statsRow");
      const total = orders.length;
      const pending = orders.filter(o => o.status === 0).length;
      const progress = orders.filter(o => o.status >= 1 && o.status <= 3).length;
      const done = orders.filter(o => o.status === 4).length;
      wrap.innerHTML = `
        <div class="admin-stat"><div class="num">${total}</div><div class="lbl">Total Order</div></div>
        <div class="admin-stat"><div class="num" style="color:#facc15">${pending}</div><div class="lbl">Menunggu Bayar</div></div>
        <div class="admin-stat"><div class="num" style="color:#38bdf8">${progress}</div><div class="lbl">Diproses</div>
        <div class="admin-stat"><div class="num" style="color:#34d399">${done}</div><div class="lbl">Selesai</div></div>
      `;
    }

    function renderTable(orders) {
      const body = document.getElementById("orderBody");
      if (!orders.length) {
        body.innerHTML = `<tr><td colspan="9"><div class="empty-state"><i class="fa-solid fa-inbox"></i><p>Belum ada order. Tunggu customer chat via WhatsApp.</p></div></td></tr>`;
        return;
      }
      body.innerHTML = orders.map(o => {
        const hasContact = Boolean(String(o.customerContact || "").replace(/[^0-9]/g, ""));
        const waLink = waHref(o.customerContact);
        return `<tr>
          <td style="font-family:var(--font-head);font-weight:700">${esc(o.id)}</td>
          <td>${esc(o.gameName)}</td>
          <td>${esc(o.serviceName)}</td>
          <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis">${esc(o.target)}</td>
          <td>${esc(o.username)}</td>
          <td style="font-weight:700;color:var(--cyan)">Rp ${Number(o.price || 0).toLocaleString("id-ID")}</td>
          <td><select class="status-select" data-id="${esc(o.id)}" onchange="updateStatus(this)">
            ${STATUS_LABELS.map((lbl, i) => `<option value="${i}" ${i === o.status ? "selected" : ""}>${esc(lbl)}</option>`).join("")}
          </select></td>
          <td>${hasContact ? `<a href="${waLink}" target="_blank" rel="noopener" class="wa-link"><i class="fa-brands fa-whatsapp"></i> Chat</a>` : "—"}</td>
          <td><button class="btn btn-ghost btn-sm" data-delete="${esc(o.id)}" title="Hapus"><i class="fa-solid fa-trash"></i></button></td>
        </tr>`;
      }).join("");
      body.querySelectorAll("[data-delete]").forEach(btn => btn.addEventListener("click", () => deleteOrder(btn.dataset.delete)));
    }

    async function updateStatus(sel) {
      const id = sel.dataset.id;
      const status = sel.value;
      const ok = await updateOrderStatus(id, status);
      if (ok) loadAndRender();
      else alert("Gagal update status");
    }

    async function deleteOrder(id) {
      if (!confirm("Hapus order " + id + "?")) return;
      const res = await fetch(API + "/api/order/" + encodeURIComponent(id), { method: "DELETE", headers: adminHeaders() });
      const json = await res.json();
      if (json.success) loadAndRender();
      else alert("Gagal menghapus order");
    }

    async function loadAndRender() {
      const orders = await loadOrders();
      renderStats(orders);
      renderTable(orders);
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadAndRender();
      document.getElementById("refreshBtn").addEventListener("click", loadAndRender);
    });
  </script>
  <script>
    // Toggle tema untuk halaman WA admin (tanpa js/script.js)
    (function () {
      function cur() { return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark"; }
      var btn = document.getElementById("themeToggle");
      function sync() {
        var t = cur();
        btn.innerHTML = t === "light" ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
      }
      btn.addEventListener("click", function () {
        var t = cur() === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        try { localStorage.setItem("fj_theme", t); } catch (e) { }
        sync();
      });
      sync();
    })();
  </script>
</body>
